name: Loop Health
description: >-
  Loop Health is an India-based health assurance and group insurance company, founded in 2018 by
  Mayank Kale and Amrit Singh and headquartered in Pune. It combines traditional group hospitalization
  insurance with unlimited primary care, telemedicine, wellness programs, mental-health counseling, and
  an Employee Assistance Program, delivered to employers and their teams through asset-light clinics and
  a member app. Backed by General Catalyst, Elevation Capital and Y Combinator, Loop serves 1,250+
  companies and 950,000+ members across India. This profile was surfaced as a General Catalyst portfolio
  company; as of this enrichment pass Loop Health publishes no public developer portal, API documentation,
  or machine-readable API surface.
